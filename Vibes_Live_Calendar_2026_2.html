}

function render(){if(!projects.length)return;updateMonthLabel();const days=getDays(),selectedDivs=getMultiValues('divFilterMenu'),filterCat=document.getElementById('filterCat').value,selectedMgrs=getMultiValues('mgrFilterMenu'),selectedAssists=getMultiValues('assistFilterMenu'),viewMode=document.getElementById('viewMode').value,table=document.getElementById('calTable');table.innerHTML='';const matchCat=p=>{if(filterCat==='ALL')return true;const isLT=/long[\s_]*term/i.test(p.cat||'');const isPP=/payment[\s_]*processing/i.test(p.cat||'');if(filterCat==='LT')return isLT;if(filterCat==='PP')return isPP;return !isLT&&!isPP;};const matchMgr=p=>selectedMgrs.includes('ALL')||selectedMgrs.includes(p.ic);const matchAssist=p=>selectedAssists.includes('ALL')||selectedAssists.includes(p.assist);const activeDivs=selectedDivs.includes('ALL')?DIVISIONS:DIVISIONS.filter(d=>selectedDivs.includes(d));const om={};activeDivs.forEach(div=>{const dp=projects.filter(p=>p.div===div&&p.status!=='Cancelled'&&p.e>=days[0]&&p.s<=days[days.length-1]&&matchCat(p)&&matchMgr(p)&&matchAssist(p));days.forEach(day=>{if(dp.filter(p=>day>=p.s&&day<=p.e).length>1)om[div+'_'+dk(day)]=true;});});const hRow=table.insertRow();hRow.className='header-row';const hTh=document.createElement('th');hTh.textContent='Project / Incharge';hRow.appendChild(hTh);days.forEach(day=>{const th=document.createElement('th');th.innerHTML='<div style="font-size:11px;font-weight:700">'+day.getDate()+'</div><div style="font-size:9px;opacity:0.8">'+day.toLocaleString('default',{weekday:'short'}).toUpperCase()+'</div>';if(dk(day)===dk(TODAY))th.className='today-col';else if(day.getDay()===5||day.getDay()===6)th.className='weekend-col';if(dk(day)===selectedCol)th.className+=' selected-col';th.style.cursor='pointer';th.onclick=function(){selectedCol=(selectedCol===dk(day))?null:dk(day);render();};hRow.appendChild(th);});const mRow=table.insertRow();mRow.className='month-row';const mTd=document.createElement('td');mTd.textContent='';mRow.appendChild(mTd);days.forEach(day=>{const td=document.createElement('td');if(day.getDate()===1)td.textContent=day.toLocaleString('default',{month:'long'}).toUpperCase();mRow.appendChild(td);});(viewMode==='DATE'?[activeDivs[0]]:activeDivs).forEach(div=>{let dp;if(viewMode==='DATE'){dp=[];activeDivs.forEach(dv=>{dp=dp.concat(projects.filter(p=>p.div===dv&&p.status!=='Cancelled'&&p.e>=days[0]&&p.s<=days[days.length-1]&&matchCat(p)&&matchMgr(p)&&matchAssist(p)));});dp.sort((a,b)=>a.s-b.s||a.e-b.e);}else{dp=projects.filter(p=>p.div===div&&p.status!=='Cancelled'&&p.e>=days[0]&&p.s<=days[days.length-1]&&matchCat(p)&&matchMgr(p)&&matchAssist(p));dp.sort((a,b)=>a.s-b.s||a.e-b.e);}if(!dp.length)return;if(viewMode!=='DATE'){const dRow=table.insertRow();dRow.className='division-row';const dtd=document.createElement('td');dtd.colSpan=days.length+1;dtd.innerHTML='<div class="division-label"><span style="color:'+(COLORS[div]||'#888')+'">&#9679;</span> '+div+' <span style="font-weight:400;font-size:11px;color:#888">('+dp.length+' projects)</span></div>';dRow.appendChild(dtd);}dp.forEach(proj=>{const row=table.insertRow();row.className='project-row';const nc=document.createElement('td');nc.className='project-name-cell';nc.innerHTML=proj.name+' <span class="city-badge">'+proj.city+(proj.venue?' &#183; '+proj.venue:'')+(proj.org?' &#183; '+proj.org:'')+(proj.pn?' &#183; P.N: '+proj.pn:'')+'</span><br><span class="incharge">'+(proj.ic||'-')+' | '+(proj.assist||'-')+'</span>';row.appendChild(nc);days.forEach(day=>{const cell=document.createElement('td');cell.className='day-cell'+(dk(day)===dk(TODAY)?' today-day':'')+(day.getDay()===5||day.getDay()===6?' weekend-day':'')+(dk(day)===selectedCol?' selected-col':'');if(day>=proj.s&&day<=proj.e){const iS=dk(day)===dk(proj.s),iE=dk(day)===dk(proj.e),iSi=dk(proj.s)===dk(proj.e);const bar=document.createElement('div');bar.className='bar '+(iSi?'bar-single':iS?'bar-start':iE?'bar-end':'');bar.style.background=(proj.ic&&proj.ic.trim().toLower function toggleDropdown(menuId){
  document.querySelectorAll('.multi-select-menu').forEach(m=>{if(m.id!==menuId)m.classList.remove('open');});
  document.getElementById(menuId).classList.toggle('open');
}
document.addEventListener('click',function(e){
  if(!e.target.closest('.multi-select')){document.querySelectorAll('.multi-select-menu').forEach(m=>m.classList.remove('open'));}
});
function onMultiCheck(cb, menuId, btnId, allLabel){
  const menu=document.getElementById(menuId);
  const boxes=[...menu.querySelectorAll('input[type=checkbox]')];
  const allBox=boxes.find(b=>b.value==='ALL');
  if(cb.value==='ALL'){
    if(cb.checked){boxes.forEach(b=>{if(b!==allBox)b.checked=false;});}
  } else {
    if(cb.checked){allBox.checked=false;}
    const anyChecked=boxes.some(b=>b!==allBox&&b.checked);
    if(!anyChecked)allBox.checked=true;
  }
  updateMultiLabel(menuId,btnId,allLabel);
  render();
}
function updateMultiLabel(menuId,btnId,allLabel){
  const menu=document.getElementById(menuId);
  const boxes=[...menu.querySelectorAll('input[type=checkbox]')];
  const allBox=boxes.find(b=>b.value==='ALL');
  const btn=document.getElementById(btnId);
  if(!allBox||allBox.checked){btn.textContent=allLabel;return;}
  const sel=boxes.filter(b=>b!==allBox&&b.checked).map(b=>b.value);
  btn.textContent=sel.length?sel.join(', '):allLabel;
}
function getMultiValues(menuId){
  const menu=document.getElementById(menuId);
  const boxes=[...menu.querySelectorAll('input[type=checkbox]')];
  const allBox=boxes.find(b=>b.value==='ALL');
  if(!allBox||allBox.checked)return['ALL'];
  const sel=boxes.filter(b=>b!==allBox&&b.checked).map(b=>b.value);
  return sel.length?sel:['ALL'];
}

function toARGB(hex){return 'FF'+String(hex||'888888').replace('#','').toUpperCase();}
async function doExportExcel(){

  if(!fromVal||!toVal){alert('Please select both From and To dates.');return;}
  const rangeStart=new Date(fromVal+'T00:00:00');
  const rangeEnd=new Date(toVal+'T00:00:00');
  if(rangeEnd<rangeStart){alert('The To date must be on or after the From date.');return;}
  const days=[];
  for(let d=new Date(rangeStart);d<=rangeEnd;d.setDate(d.getDate()+1))days.push(new Date(d));
  if(days.length>400){if(!confirm('That is a large date range ('+days.length+' days) and may take a while and produce a wide file. Continue?'))return;}

  const selectedDivs=getMultiValues('divFilterMenu');
  const selectedMgrs=getMultiValues('mgrFilterMenu');const selectedAssists=getMultiValues('assistFilterMenu');
  const filterCatVal=document.getElementById('filterCat').value;
  const activeDivs=selectedDivs.includes('ALL')?DIVISIONS:DIVISIONS.filter(d=>selectedDivs.includes(d));
  const matchCat=p=>{if(filterCatVal==='ALL')return true;const isLT=/long[\s_]*term/i.test(p.cat||'');const isPP=/payment[\s_]*processing/i.test(p.cat||'');if(filterCatVal==='LT')return isLT;if(filterCatVal==='PP')return isPP;return !isLT&&!isPP;};
  const matchMgr=p=>selectedMgrs.includes('ALL')||selectedMgrs.includes(p.ic);const matchAssist=p=>selectedAssists.includes('ALL')||selectedAssists.includes(p.assist);
  const inRange=p=>p.e>=rangeStart&&p.s<=rangeEnd;

  const wb=new ExcelJS.Workbook();
  const ws=wb.addWorksheet('Calendar');
  const fmtDate=d=>d.getDate()+' '+d.toLocaleString('default',{month:'short'})+' '+d.getFullYear();

  ws.getColumn(1).width=42;
  ws.getColumn(2).width=12;
  ws.getColumn(3).width=16;
  ws.getColumn(4).width=16;
  ws.getColumn(5).width=8;
  ws.getColumn(6).width=8;
  for(let i=0;i<days.length;i++)ws.getColumn(i+7).width=3.5;

  ws.mergeCells(1,1,1,days.length+6);
  const titleCell=ws.getCell(1,1);
  titleCell.value='Vibes Events - Project Calendar  ('+fmtDate(rangeStart)+' - '+fmtDate(rangeEnd)+')';
  titleCell.font={bold:true,size:14,color:{argb:'FF1A1A2E'}};

  ws.mergeCells(2,1,2,days.length+6);
  const subCell=ws.getCell(2,1);
  const divLabel=selectedDivs.includes('ALL')?'All Divisions':selectedDivs.join(', ');
  const mgrLabel=selectedMgrs.includes('ALL')?'All Managers':selectedMgrs.join(', ');
  const assistLabel=selectedAssists.includes('ALL')?'All Assistants':selectedAssists.join(', ');
  const catLabel=filterCatVal==='ALL'?'All Categories':(filterCatVal==='LT'?'Long Term':(filterCatVal==='PP'?'Payment Processing':'Short Term'));
  subCell.value='Divisions: '+divLabel+'   |   Managers: '+mgrLabel+'   |   Assistants: '+assistLabel+'   |   Category: '+catLabel;
  subCell.font={italic:true,size:10,color:{argb:'FF666666'}};

  const headerRowIdx=4;
  const headerRow=ws.getRow(headerRowIdx);
  const hc1=headerRow.getCell(1);
  hc1.value='Project / Incharge';
  hc1.font={bold:true,color:{argb:'FFFFFFFF'}};
  hc1.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A1A2E'}};
  const hc2=headerRow.getCell(2);
  hc2.value='Division';
  hc2.font={bold:true,color:{argb:'FFFFFFFF'}};
  hc2.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A1A2E'}};
  hc2.alignment={horizontal:'center'};
  const hc3=headerRow.getCell(3);
  hc3.value='Projects In-charge';
  hc3.font={bold:true,color:{argb:'FFFFFFFF'}};
  hc3.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A1A2E'}};
  hc3.alignment={horizontal:'center'};
  const hc4=headerRow.getCell(4);
  hc4.value='Project Assistant';
  hc4.font={bold:true,color:{argb:'FFFFFFFF'}};
  hc4.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A1A2E'}};
  hc4.alignment={horizontal:'center'};
  const hc5=headerRow.getCell(5);
  hc5.value='NO.Staff';
  hc5.font={bold:true,color:{argb:'FFFFFFFF'}};
  hc5.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A1A2E'}};
  hc5.alignment={horizontal:'center'};
  const hc6=headerRow.getCell(6);
  hc6.value='No.Sup';
  hc6.font={bold:true,color:{argb:'FFFFFFFF'}};
  hc6.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF1A1A2E'}};
  hc6.alignment={horizontal:'center'};
  days.forEach((d,i)=>{
    const c=headerRow.getCell(i+7);
    c.value=d.getDate()+'\n'+d.toLocaleString('default',{weekday:'short'}).toUpperCase();
    const isWknd=(d.getDay()===0||d.getDay()===6);
    c.font={bold:true,size:9,color:{argb:'FFFFFFFF'}};
    c.fill={type:'pattern',pattern:'solid',fgColor:{argb:isWknd?'FF2D2D4E':'FF1A1A2E'}};
    c.alignment={horizontal:'center',wrapText:true};
  });
  headerRow.height=28;

  const monthRowIdx=5;
  const monthRow=ws.getRow(monthRowIdx);
  ws.mergeCells(monthRowIdx,1,monthRowIdx,6);
  let curKey=null,startCol=7;
  days.forEach((d,i)=>{
    const key=d.getFullYear()+'-'+d.getMonth();
    if(key!==curKey){
      if(curKey!==null)ws.mergeCells(monthRowIdx,startCol,monthRowIdx,i+6);
      curKey=key;startCol=i+7;
      monthRow.getCell(i+7).value=d.toLocaleString('default',{month:'long',year:'numeric'});
    }
  });
  ws.mergeCells(monthRowIdx,startCol,monthRowIdx,days.length+6);
  monthRow.eachCell({includeEmpty:true},c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFE8EAF0'}};c.font={bold:true,size:10,color:{argb:'FF333333'}};c.alignment={horizontal:'left'};});
  monthRow.height=16;

  let rIdx=monthRowIdx;
  function addProjectRow(p){
    rIdx++;
    const row=ws.getRow(rIdx);
    let label=p.name+' | '+(p.city||'')+(p.org?(' - '+p.org):'')+(p.pn?(' - P.N:'+p.pn):'');
    label+='\n'+(p.ic||'-')+' | '+(p.assist||'-');
    label+='\nStaff: '+(p.staff||0)+' | Sup: '+(p.sup||0);
    const c1=row.getCell(1);
    c1.value=label;
    c1.alignment={wrapText:true,vertical:'middle'};
    c1.font={size:9};
    const c2=row.getCell(2);
    c2.value=p.div;
    c2.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    c2.font={size:9,bold:true};
    const c3=row.getCell(3);
    c3.value=p.ic||'-';
    c3.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    c3.font={size:9};
    const c4=row.getCell(4);
    c4.value=p.assist||'-';
    c4.alignment={horizontal:'center',vertical:'middle',wrapText:true};
    c4.font={size:9};
    const c5=row.getCell(5);
    c5.value=p.staff||0;
    c5.alignment={horizontal:'center',vertical:'middle'};
    c5.font={size:9};
    const c6=row.getCell(6);
    c6.value=p.sup||0;
    c6.alignment={horizontal:'center',vertical:'middle'};
    c6.font={size:9};
    const argb=toARGB(COLORS[p.div]);
    days.forEach((d,i)=>{
      if(d>=p.s&&d<=p.e){
        row.getCell(i+7).fill={type:'pattern',pattern:'solid',fgColor:{argb}};
      }
    });
    row.height=28;
  }

  if(typeof viewMode!=='undefined'&&document.getElementById('viewMode').value==='SECTION'){
    activeDivs.forEach(div=>{
      const dp=projects.filter(p=>p.div===div&&inRange(p)&&matchCat(p)&&matchMgr(p)&&matchAssist(p)).sort((a,b)=>a.s-b.s);
      if(!dp.length)return;
      rIdx++;
      const hRow=ws.getRow(rIdx);
      ws.mergeCells(rIdx,1,rIdx,6);
      hRow.getCell(1).value=div+' ('+dp.length+' projects)';
      hRow.getCell(1).font={bold:true,size:11};
      hRow.eachCell({includeEmpty:true},c=>{c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF0F2F8'}};});
      dp.forEach(addProjectRow);
    });
  } else {
    let dp=[];
    activeDivs.forEach(div=>{dp=dp.concat(projects.filter(p=>p.div===div&&inRange(p)&&matchCat(p)&&matchMgr(p)&&matchAssist(p)));});
    dp.sort((a,b)=>a.s-b.s);
    dp.forEach(addProjectRow);
  }

  ws.views=[{state:'frozen',xSplit:6,ySplit:monthRowIdx,topLeftCell:'G'+(monthRowIdx+1)}];

  const buf=await wb.xlsx.writeBuffer();
  const blob=new Blob([buf],{type:'application/octet-stream'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='Vibes_Calendar_'+fromVal+'_to_'+toVal+'.xlsx';
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toggleExportPanel();
}

function toggleViewRangePanel(){
  const panel=document.getElementById('viewRangePanel');
  const isOpen=panel.style.display==='flex';
  if(isOpen){panel.style.display='none';return;}
  document.getElementById('exportPanel').style.display='none';
  const from=customRange?customRange.start:viewStart;
  const to=customRange?customRange.end:new Date(viewStart.getFullYear(), viewStart.getMonth()+2, 0);
  document.getElementById('viewFrom').value=dkLocal(from);
  document.getElementById('viewTo').value=dkLocal(to);
  panel.style.display='flex';
}
function applyViewRange(){
  const fromVal=document.getElementById('viewFrom').value;
  const toVal=document.getElementById('viewTo').value;
  if(!fromVal||!toVal){alert('Please select both From and To dates.');return;}
  const start=new Date(fromVal+'T00:00:00');
  const end=new Date(toVal+'T00:00:00');
  if(end<start){alert('The To date must be on or after the From date.');return;}
  customRange={start,end};
  render();
  toggleViewRangePanel();
}
function resetViewRange(){
  customRange=null;
  render();
  toggleViewRangePanel();
}

loadData();
</script>
</body></html>
